version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bidmaster-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-bidmaster}
    ports:
      - "5432:5432"
    volumes:
      - ./postgres:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: bidmaster-api
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-bidmaster}
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  # Frontend ще бъде добавен от Абед
  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
