name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [develop, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install backend dependencies
        run: cd backend && npm install

      - name: Build backend
        run: cd backend && npm run build

      - name: Run backend security audit
        run: cd backend && npm audit --audit-level=moderate || true

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Run frontend security audit
        run: cd frontend && npm audit --audit-level=moderate || true

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker images
        run: |
          docker build -t bidmaster-backend:latest ./backend
          docker build -t bidmaster-frontend:latest ./frontend

      - name: Push to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag bidmaster-backend:latest ${{ secrets.DOCKER_USERNAME }}/bidmaster-backend:latest
          docker tag bidmaster-frontend:latest ${{ secrets.DOCKER_USERNAME }}/bidmaster-frontend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/bidmaster-backend:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/bidmaster-frontend:latest
